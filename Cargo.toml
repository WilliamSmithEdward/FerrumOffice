[workspace]
resolver = "3"
members = [
    "crates/ferrum-core",
    "crates/ferrum-theme",
    "crates/ferrum-calc",
    "crates/ferrum-sheet",
    "crates/ferrum-xlsx",
    "crates/ferrum-grid-view",
    "apps/ferrum-grid",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/WilliamSmithEdward/FerrumOffice"

# Only path dependencies appear here, and that is a rule rather than a
# coincidence: the shipped product depends on the standard library and on the
# GUI toolkit, nothing else. See docs/adr/0002-no-runtime-dependencies.md.
[workspace.dependencies]
ferrum-core = { path = "crates/ferrum-core" }
ferrum-theme = { path = "crates/ferrum-theme" }
ferrum-calc = { path = "crates/ferrum-calc" }
ferrum-sheet = { path = "crates/ferrum-sheet" }
ferrum-xlsx = { path = "crates/ferrum-xlsx" }
ferrum-grid-view = { path = "crates/ferrum-grid-view" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds spend most of their time inside the calculation engine and the
# renderer, so its dependencies are optimised even when the workspace is not.
[profile.dev.package."*"]
opt-level = 2
