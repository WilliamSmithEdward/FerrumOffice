name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody sees is a warning that accumulates.
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Windows because that is what the application targets, and because the
    # hosted runner uses the MSVC toolchain, which avoids the missing import
    # library described in docs/building-on-windows.md.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build the application
        run: cargo build --release -p ferrum-grid
